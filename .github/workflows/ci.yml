name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Compression integration tests execute the real native engines.
        # The Docker job below verifies the production image independently.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript qpdf ocrmypdf tesseract-ocr-eng \
            libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui \
            fonts-liberation fonts-dejavu-core libseccomp2
          pnpm test
          node --test scripts/workspace-sample.test.mjs

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Diff check
        run: git diff --check

  production-container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production API image
        run: |
          git show 193f59719fcebe4c1011ebb0386891f9f5c68088:apps/api/Dockerfile > /tmp/kagaz-baseline.Dockerfile
          docker build -f /tmp/kagaz-baseline.Dockerfile -t kagaz-api:baseline .
          docker build -f apps/api/Dockerfile -t kagaz-api:verify .
      - name: Verify Office conversion, output integrity, attacks, isolation and resource use
        env:
          KAGAZ_ARTIFACT_DIR: ${{ runner.temp }}/phase4c-artifacts
        run: node scripts/verify-phase4c-container.mjs
      - name: Verify container health, tools, compression, failures and cleanup
        run: node scripts/verify-phase4a-container.mjs
      - name: Audit constrained resource scaling, cancellation and shutdown
        env:
          KAGAZ_ARTIFACT_DIR: ${{ runner.temp }}/phase4c-artifacts
        run: node scripts/verify-phase4d-container.mjs
      - name: Install browser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf
          pnpm exec playwright install --with-deps chromium
      - name: Verify editor and real container together
        env:
          KAGAZ_ARTIFACT_DIR: ${{ runner.temp }}/phase4c-artifacts
        run: |
          pnpm --filter @kagaz/web dev --host 127.0.0.1 > /tmp/kagaz-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/ > /dev/null && break; sleep 1; done
          node scripts/verify-phase4b-container.mjs
          docker run -d --name kagaz-browser-api --init --memory=512m --cpus=0.5 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 -p 127.0.0.1:4000:4000 kagaz-api:verify
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/health > /dev/null && break; sleep 1; done
          node scripts/verify-phase4a.mjs
          node scripts/verify-phase4b.mjs
          node scripts/verify-phase4c.mjs
      - name: Verify browser-local redaction and independent content removal
        env:
          KAGAZ_ARTIFACT_DIR: ${{ runner.temp }}/phase4c-artifacts
          KAGAZ_REQUIRE_QPDF: '1'
        run: node scripts/verify-phase5a.mjs
      - name: Verify browser-local watermarking and redaction compatibility
        env:
          KAGAZ_ARTIFACT_DIR: ${{ runner.temp }}/phase4c-artifacts
          KAGAZ_REQUIRE_QPDF: '1'
        run: node scripts/verify-phase5b.mjs
      - name: Save verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4d-verification
          path: ${{ runner.temp }}/phase4c-artifacts
          if-no-files-found: ignore
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs kagaz-browser-api || true
          docker stats --no-stream kagaz-browser-api || true
          docker rm -f kagaz-browser-api || true
